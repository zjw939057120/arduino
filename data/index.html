<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>欢迎使用</title>
</head>

<style>
    /* 1. 默认隐藏所有内容块 */
    .content > div {
        display: none;
        padding: 10px;
        border: 1px solid #ddd;
        margin-top: 10px;
    }
    
    /* 2. 默认 Tab 样式 */
    .tabbox ul li {
        display: inline-block;
        padding: 8px 15px;
        cursor: pointer;
        background-color: #f0f0f0;
    }
    
    /* 3. 激活状态的样式 */
    .tabbox ul li.active {
        background-color: #007bff;
        color: #fff;
    }
    .content > div.active {
        display: block; /* 只有带有 active 的内容才会显示 */
    }
</style>

<body>
<div class="tabbox">
    <ul>
        <li data="address">地址设置</li>
        <li data="alarm">报警阀值</li>
        <li data="wifi">无线设置</li>
        <li data="ble">蓝牙设置</li>
        <li data="network">网络设置</li>
        <li data="service">服务设置</li>
    </ul>
    <div class="content">
        <div data="home">首页内容</div>
        <div data="address">地址设置内容</div>
        <div data="alarm">报警阀值内容</div>
        <div data="wifi">无线设置内容</div>
        <div data="ble">蓝牙设置内容</div>
        <div data="network">网络设置内容</div>
        <div data="service">服务设置内容</div>
    </div>
</div>
</body>

<script>
    loadHomeData();

    // 获取所有的 li 和 内容 div
    const tabs = document.querySelectorAll('.tabbox ul li');
    const contents = document.querySelectorAll('.content > div');

    // 使用事件委托，将点击事件绑定在父元素 ul 上
    document.querySelector('.tabbox ul').addEventListener('click', function(event) {
        const target = event.target;
        
        // 确保点击的是 li 元素
        if (target.tagName === 'LI') {
            // 1. 获取当前点击的 li 的 data 属性值
            const currentData = target.getAttribute('data');
            
            // 2. 移除所有 li 的 active 状态
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // 3. 核心：移除所有内容的 active 状态（实现其他内容隐藏）
            contents.forEach(content => content.classList.remove('active'));
            
            // 4. 给当前点击的 li 添加 active 状态
            target.classList.add('active');
            
            // 5. 根据 data 属性，找到对应的内容块并添加 active 状态（实现对应内容显示）
            const targetContent = document.querySelector(`.content > div[data="${currentData}"]`);
            if (targetContent) {
                targetContent.classList.add('active');
            }
            // 6. 更新页面标题为当前点击的 li 文本内容
            document.title = target.textContent;

            if (currentData === 'home') {
                // 加载首页数据
                loadHomeData();
            }else if (currentData === 'address') {
                // 加载地址设置数据
                loadAddressData();
            }else if (currentData === 'alarm') {
                // 加载报警阀值数据
                loadAlarmData();
            }else if (currentData === 'wifi') {
                // 加载无线设置数据
                loadWifiData();
            }else if (currentData === 'ble') {
                // 加载蓝牙设置数据
                loadBleData();
            }else if (currentData === 'network') {
                // 加载网络设置数据
                loadNetworkData();
            }else if (currentData === 'service') {
                // 加载服务设置数据
                loadServiceData();
            }
        }
    });

// 加载首页数据
function loadHomeData() {
const targetContent = document.querySelector(`.content > div[data="home"]`);
if (targetContent) {
    targetContent.classList.add('active');
    // 2. 发起 GET 请求
    fetch('http://172.168.16.128/home')
        .then(response => {
            if (!response.ok) throw new Error('网络请求失败');
            return response.json();
        })
        .then(data => {
            // 3. 定义需要展示的字段及其中文标签映射
            const fieldMap = {
                status: '设备状态',
                ssid: '无线网络(SSID)',
                rssi: '信号强度(RSSI)',
                localIP: '本地IP地址',
                gatewayIP: '网关地址',
                subnetMask: '子网掩码',
                bssid: 'MAC地址',
                dnsIP: 'DNS服务器'
            };

            // 4. 动态生成 HTML 列表
            let html = '<ul style="list-style:none; padding:0; margin:0;">';
            for (const [key, label] of Object.entries(fieldMap)) {
                if (data[key] !== undefined) {
                    // 特殊处理：如果字段是 status，可以加上状态说明
                    let value = data[key];
                    if (key === 'status') {
                        value = data.status === 2 ? '正常在线' : '状态码: ' + data.status;
                    }
                    // 拼接列表项，并添加一点基础样式
                    html += `<li style="padding: 8px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between;">
                                <span style="color: #666;">${label}</span>
                                <span style="font-weight: bold; color: #333;">${value}</span>
                             </li>`;
                }
            }
            html += '</ul>';

            // 5. 将生成的 HTML 渲染到首页内容块中
            targetContent.innerHTML = html;
        })
        .catch(error => {
            console.error('获取首页数据失败:', error);
            targetContent.textContent = '❌ 数据加载失败，请检查网络或接口地址';
        });
}
}

function loadAddressData() {
    const targetContent = document.querySelector(`.content > div[data="address"]`);
    if (targetContent) {
        fetch('http://172.168.16.128/address')
            .then(response => {
                if (!response.ok) throw new Error('网络请求失败');
                return response.json();
            })
            .then(data => {
                // 定义表单字段的配置
                const fields = [
                    { key: 'addr', label: '设备地址', type: 'input', inputType: 'number', min: 1, max: 247 },
                    { key: 'baud', label: '波特率', type: 'select', options: [9600, 19200, 38400, 57600, 115200] },
                    // 修改点：将数据位改为下拉框，提供 5~8 的选项
                    { key: 'databits', label: '数据位', type: 'select', options: [8, 9] }, 
                    { key: 'parity', label: '校验位', type: 'select', options: [{val: 0, text: '无 (None)'}, {val: 1, text: '奇校验 (Odd)'}, {val: 2, text: '偶校验 (Even)'}] },
                    { key: 'stopbits', label: '停止位', type: 'select', options: [{val: 1, text: '1'}, {val: 2, text: '1.5'}, {val: 3, text: '2'}] }
                ];

                let html = '<form style="display: flex; flex-direction: column; gap: 15px;">';
                
                fields.forEach(field => {
                    const value = data[field.key];
                    const fieldId = `field_${field.key}`;
                    
                    html += `<div style="display: flex; align-items: center; justify-content: space-between;">`;
                    html += `<label for="${fieldId}" style="width: 80px; color: #555;">${field.label}：</label>`;
                    
                    if (field.type === 'input') {
                        // 渲染输入框
                        html += `<input type="${field.inputType}" id="${fieldId}" value="${value}" 
                                       min="${field.min || ''}" max="${field.max || ''}" 
                                       style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">`;
                    } else if (field.type === 'select') {
                        // 渲染下拉框
                        html += `<select id="${fieldId}" style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">`;
                        field.options.forEach(opt => {
                            // 处理 options 可能是对象 {val, text} 或 简单值
                            const optVal = typeof opt === 'object' ? opt.val : opt;
                            const optText = typeof opt === 'object' ? opt.text : opt;
                            const selected = value == optVal ? 'selected' : ''; // 使用 == 进行宽松比较，防止类型不匹配
                            html += `<option value="${optVal}" ${selected}>${optText}</option>`;
                        });
                        html += `</select>`;
                    }
                    
                    html += `</div>`;
                });

                // 添加保存按钮
                html += `<div style="text-align: right; margin-top: 10px;">
                            <button type="button" onclick="saveAddressData()" 
                                    style="padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                保存设置
                            </button>
                         </div>`;
                html += `</form>`;

                targetContent.innerHTML = html;
            })
            .catch(error => {
                console.error('获取地址设置失败:', error);
                targetContent.innerHTML = '<span style="color:red;">❌ 加载失败</span>';
            });
    }
}

// 保存数据的函数
function saveAddressData() {
    // 1. 收集表单数据
    const formData = {
        addr: parseInt(document.getElementById('field_addr').value),
        baud: parseInt(document.getElementById('field_baud').value),
        databits: parseInt(document.getElementById('field_databits').value),
        parity: parseInt(document.getElementById('field_parity').value),
        stopbits: parseInt(document.getElementById('field_stopbits').value)
    };
    
    // 2. 将对象转换为表单字符串格式：key=value&key=value
    const urlEncodedData = Object.keys(formData)
        .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(formData[key]))
        .join('&');

    // 3. 使用 fetch 发送 POST 请求
    fetch('http://172.168.16.128/address', {
        method: 'POST',
        headers: {
            // 核心修改：将 Content-Type 改为表单格式
            'Content-Type': 'application/x-www-form-urlencoded' 
        },
        body: urlEncodedData // 提交表单格式的字符串
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('网络请求失败，状态码: ' + response.status);
        }
        return response.json(); // 解析返回的 JSON 数据
    })
    .then(data => {
        console.log('服务器返回的数据:', data);
        if (data.code === 0) {
            loadAddressData();
            alert('✅ 设置保存成功！');
        } else {
            alert('❌ 保存失败，服务器返回错误。');
        }
    })
    .catch(error => {
        console.error('提交数据时出错:', error);
        alert('❌ 提交失败，请检查网络连接或控制台日志。');
    });
}

</script>
</html>
