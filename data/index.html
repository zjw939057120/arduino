<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>欢迎使用</title>
</head>

<style>
    /* 1. 默认隐藏所有内容块 */
    .content > div {
        display: none;
        padding: 10px;
        border: 1px solid #ddd;
        margin-top: 10px;
    }
    
    /* 2. 默认 Tab 样式 */
    .tabbox ul li {
        display: inline-block;
        padding: 8px 15px;
        cursor: pointer;
        background-color: #f0f0f0;
    }
    
    /* 3. 激活状态的样式 */
    .tabbox ul li.active {
        background-color: #007bff;
        color: #fff;
    }
    .content > div.active {
        display: block; /* 只有带有 active 的内容才会显示 */
    }
</style>

<body>
<div class="tabbox">
    <ul>
        <li data="address">地址设置</li>
        <li data="alarm">报警阀值</li>
        <li data="wifi">无线设置</li>
        <li data="ble">蓝牙设置</li>
        <li data="network">网络设置</li>
        <li data="service">服务设置</li>
    </ul>
    <div class="content">
        <div data="home">首页内容</div>
        <div data="address">地址设置内容</div>
        <div data="alarm">报警阀值内容</div>
        <div data="wifi">无线设置内容</div>
        <div data="ble">蓝牙设置内容</div>
        <div data="network">网络设置内容</div>
        <div data="service">服务设置内容</div>
    </div>
</div>
</body>

<script>
    loadHomeData();

    // 获取所有的 li 和 内容 div
    const tabs = document.querySelectorAll('.tabbox ul li');
    const contents = document.querySelectorAll('.content > div');

    // 使用事件委托，将点击事件绑定在父元素 ul 上
    document.querySelector('.tabbox ul').addEventListener('click', function(event) {
        const target = event.target;
        
        // 确保点击的是 li 元素
        if (target.tagName === 'LI') {
            // 1. 获取当前点击的 li 的 data 属性值
            const currentData = target.getAttribute('data');
            
            // 2. 移除所有 li 的 active 状态
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // 3. 核心：移除所有内容的 active 状态（实现其他内容隐藏）
            contents.forEach(content => content.classList.remove('active'));
            
            // 4. 给当前点击的 li 添加 active 状态
            target.classList.add('active');
            
            // 5. 根据 data 属性，找到对应的内容块并添加 active 状态（实现对应内容显示）
            const targetContent = document.querySelector(`.content > div[data="${currentData}"]`);
            if (targetContent) {
                targetContent.classList.add('active');
            }
            // 6. 更新页面标题为当前点击的 li 文本内容
            document.title = target.textContent;

            if (currentData === 'home') {
                // 加载首页数据
                loadHomeData();
            }else if (currentData === 'address') {
                // 加载地址设置数据
                loadAddressData();
            }else if (currentData === 'alarm') {
                // 加载报警阀值数据
                loadAlarmData();
            }else if (currentData === 'wifi') {
                // 加载无线设置数据
                loadWifiData();
            }else if (currentData === 'ble') {
                // 加载蓝牙设置数据
                loadBleData();
            }else if (currentData === 'network') {
                // 加载网络设置数据
                loadNetworkData();
            }else if (currentData === 'service') {
                // 加载服务设置数据
                loadServiceData();
            }
        }
    });

// 加载首页数据
function loadHomeData() {
const targetContent = document.querySelector(`.content > div[data="home"]`);
if (targetContent) {
    targetContent.classList.add('active');
    // 2. 发起 GET 请求
    fetch('http://172.168.16.128/home')
        .then(response => {
            if (!response.ok) throw new Error('网络请求失败');
            return response.json();
        })
        .then(data => {
            // 3. 定义需要展示的字段及其中文标签映射
            const fieldMap = {
                status: '设备状态',
                ssid: '无线网络(SSID)',
                rssi: '信号强度(RSSI)',
                local_ip: '本地IP地址',
                gateway_ip: '网关地址',
                subnet_mask: '子网掩码',
                bssid: 'MAC地址',
                dns_ip: 'DNS服务器'
            };

            // 4. 动态生成 HTML 列表
            let html = '<ul style="list-style:none; padding:0; margin:0;">';
            for (const [key, label] of Object.entries(fieldMap)) {
                if (data[key] !== undefined) {
                    // 特殊处理：如果字段是 status，可以加上状态说明
                    let value = data[key];
                    if (key === 'status') {
                        value = data.status === 2 ? '正常在线' : '状态码: ' + data.status;
                    }
                    // 拼接列表项，并添加一点基础样式
                    html += `<li style="padding: 8px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between;">
                                <span style="color: #666;">${label}</span>
                                <span style="font-weight: bold; color: #333;">${value}</span>
                             </li>`;
                }
            }
            html += '</ul>';

            // 5. 将生成的 HTML 渲染到首页内容块中
            targetContent.innerHTML = html;
        })
        .catch(error => {
            console.error('获取首页数据失败:', error);
            targetContent.textContent = '❌ 数据加载失败，请检查网络或接口地址';
        });
}
}

function loadAddressData() {
    const targetContent = document.querySelector(`.content > div[data="address"]`);
    if (targetContent) {
        fetch('http://172.168.16.128/address')
            .then(response => {
                if (!response.ok) throw new Error('网络请求失败');
                return response.json();
            })
            .then(data => {
                // 定义表单字段的配置
                const fields = [
                    { key: 'addr', label: '设备地址', type: 'input', inputType: 'number', min: 1, max: 247 },
                    { key: 'baud', label: '波特率', type: 'select', options: [9600, 19200, 38400, 57600, 115200] },
                    // 修改点：将数据位改为下拉框，提供 5~8 的选项
                    { key: 'dataBits', label: '数据位', type: 'select', options: [8, 9] }, 
                    { key: 'parity', label: '校验位', type: 'select', options: [{val: 0, text: '无 (None)'}, {val: 1, text: '奇校验 (Odd)'}, {val: 2, text: '偶校验 (Even)'}] },
                    { key: 'stopBits', label: '停止位', type: 'select', options: [{val: 1, text: '1'}, {val: 2, text: '1.5'}, {val: 3, text: '2'}] }
                ];

                let html = '<form style="display: flex; flex-direction: column; gap: 15px;">';
                
                fields.forEach(field => {
                    const value = data[field.key];
                    const fieldId = `field_${field.key}`;
                    
                    html += `<div style="display: flex; align-items: center; justify-content: space-between;">`;
                    html += `<label for="${fieldId}" style="width: 80px; color: #555;">${field.label}：</label>`;
                    
                    if (field.type === 'input') {
                        // 渲染输入框
                        html += `<input type="${field.inputType}" id="${fieldId}" value="${value}" 
                                       min="${field.min || ''}" max="${field.max || ''}" 
                                       style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">`;
                    } else if (field.type === 'select') {
                        // 渲染下拉框
                        html += `<select id="${fieldId}" style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">`;
                        field.options.forEach(opt => {
                            // 处理 options 可能是对象 {val, text} 或 简单值
                            const optVal = typeof opt === 'object' ? opt.val : opt;
                            const optText = typeof opt === 'object' ? opt.text : opt;
                            const selected = value == optVal ? 'selected' : ''; // 使用 == 进行宽松比较，防止类型不匹配
                            html += `<option value="${optVal}" ${selected}>${optText}</option>`;
                        });
                        html += `</select>`;
                    }
                    
                    html += `</div>`;
                });

                // 添加保存按钮
                html += `<div style="text-align: right; margin-top: 10px;">
                            <button type="button" onclick="saveAddressData()" 
                                    style="padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                保存设置
                            </button>
                         </div>`;
                html += `</form>`;

                targetContent.innerHTML = html;
            })
            .catch(error => {
                console.error('获取地址设置失败:', error);
                targetContent.innerHTML = '<span style="color:red;">❌ 加载失败</span>';
            });
    }
}

// 保存地址设置的函数
function saveAddressData() {
    // 1. 收集表单数据
    const formData = {
        addr: parseInt(document.getElementById('field_addr').value),
        baud: parseInt(document.getElementById('field_baud').value),
        dataBits: parseInt(document.getElementById('field_dataBits').value),
        parity: parseInt(document.getElementById('field_parity').value),
        stopBits: parseInt(document.getElementById('field_stopBits').value)
    };
    
    // 2. 将对象转换为表单字符串格式：key=value&key=value
    const urlEncodedData = Object.keys(formData)
        .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(formData[key]))
        .join('&');

    // 3. 使用 fetch 发送 POST 请求
    fetch('http://172.168.16.128/address', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded' 
        },
        body: urlEncodedData 
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('网络请求失败，状态码: ' + response.status);
        }
        return response.json(); 
    })
    .then(data => {
        console.log('服务器返回的数据:', data);
        // 核心修改：判断 code 是否为 0
        if (data.code === 0) {
            alert(data.msg || '✅ 设置保存成功！');
            loadAddressData();
        } else {
            // 如果 code 不等于 0，弹窗提示返回的 msg 内容
            // 使用 || '未知错误' 作为兜底，防止 msg 字段不存在时弹窗显示 undefined
            alert('❌ ' + (data.msg || '未知错误'));
        }
    })
    .catch(error => {
        console.error('提交数据时出错:', error);
        alert('❌ 提交失败，请检查网络连接或控制台日志。');
    });
}

function loadAlarmData() {
    // 加载报警阀值数据
}
// 加载Wi-Fi列表
function loadWifiData() {
    const targetContent = document.querySelector(`.content > div[data="wifi"]`);
    if (targetContent) {
        targetContent.innerHTML = '正在扫描Wi-Fi...';

        fetch('http://172.168.16.128/wifi')
            .then(response => {
                if (!response.ok) throw new Error('网络请求失败');
                return response.json();
            })
            .then(json => {
                if (json.code !== 0) {
                    targetContent.innerHTML = `<span style="color:red;">❌ 加载失败: ${json.msg}</span>`;
                    return;
                }

                const wifiList = json.data;
                if (!wifiList || wifiList.length === 0) {
                    targetContent.innerHTML = '<p>未发现任何Wi-Fi信号。</p>';
                    return;
                }

                let html = '<ul style="list-style: none; padding: 0; margin: 0;">';
                
                wifiList.forEach(wifi => {
                    // 将信号强度(r)转换为格数显示，例如 -47dBm 显示为 5格
                    const signalBars = getSignalBars(wifi.r);
                    // 对SSID进行HTML转义，防止XSS攻击
                    const safeSsid = wifi.s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    html += `<li style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee;">`;
                    html += `<div style="flex: 1;">`;
                    html += `<div style="font-weight: bold; color: #333;">${safeSsid}</div>`;
                    html += `<div style="font-size: 0.8em; color: #888;">信号: ${signalBars} (${wifi.r}dBm) | 信道: ${wifi.c}</div>`;
                    html += `</div>`;
                    // 将SSID和加密方式(e)作为参数传递给连接函数
                    html += `<button onclick="connectToWifi('${encodeURIComponent(wifi.s)}', ${wifi.e})" style="padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">连接</button>`;
                    html += `</li>`;
                });

                html += '</ul>';
                targetContent.innerHTML = html;
            })
            .catch(error => {
                console.error('获取Wi-Fi列表失败:', error);
                targetContent.innerHTML = '<span style="color:red;">❌ 加载失败，请检查网络</span>';
            });
    }
}

// 将信号强度转换为格数
function getSignalBars(rssi) {
    if (rssi >= -50) return '📶📶📶📶📶';
    if (rssi >= -60) return '📶📶📶📶';
    if (rssi >= -70) return '📶📶📶';
    if (rssi >= -80) return '📶📶';
    return '📶';
}

// 处理连接Wi-Fi的逻辑
function connectToWifi(encodedSsid, encryption) {
    const ssid = decodeURIComponent(encodedSsid);
    
    // 如果是开放网络（无加密），可以直接尝试连接，这里简化为直接提交空密码
    let password = '';
    if (encryption !== 0) {
        password = prompt(`请输入Wi-Fi "${ssid}" 的密码：`);
        // 用户点击取消时，password 为 null
        if (password === null) return;
    }

    // 准备提交的数据
    const formData = {
        ssid: ssid,      // Wi-Fi 名称
        pwd: password   // Wi-Fi 密码
    };

    // 转换为表单格式
    const urlEncodedData = Object.keys(formData)
        .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(formData[key]))
        .join('&');

    // 发送POST请求
    fetch('http://172.168.16.128/wifi', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: urlEncodedData
    })
    .then(response => {
        if (!response.ok) throw new Error('网络请求失败');
        return response.json();
    })
    .then(data => {
        if (data.code === 0) {
            alert(data.msg || '✅ 连接请求已发送');
        } else {
            alert('❌ ' + (data.msg || '未知错误'));
        }
    })
    .catch(error => {
        console.error('连接Wi-Fi时出错:', error);
        alert('❌ 提交失败，请检查网络连接。');
    });
}
function loadBleData() {
    // 加载蓝牙设置数据
}
// 加载网络设置
function loadNetworkData() {
    const targetContent = document.querySelector(`.content > div[data="network"]`);
    if (targetContent) {
        fetch('http://172.168.16.128/network')
            .then(response => {
                if (!response.ok) throw new Error('网络请求失败');
                return response.json();
            })
            .then(data => {
                // 判断是否为动态IP：如果关键字段为空，则视为动态IP
                const isDhcp = !data.local_ip && !data.subnet_mask && !data.gateway_ip && !data.dns_ip;

                // 定义表单字段配置
                const fields = [
                    { key: 'local_ip', label: '本地IP' },
                    { key: 'subnet_mask', label: '子网掩码' },
                    { key: 'gateway_ip', label: '网关' },
                    { key: 'dns_ip', label: 'DNS服务器' }
                ];

                let html = '<form style="display: flex; flex-direction: column; gap: 15px;">';
                
                // 1. 渲染 IP模式 单选框
                html += `<div style="display: flex; align-items: center; justify-content: space-between;">`;
                html += `<label style="width: 80px; color: #555;">IP模式：</label>`;
                html += `<div style="flex: 1; display: flex; gap: 20px;">`;
                html += `<label><input type="radio" name="ip_mode" value="dhcp" ${isDhcp ? 'checked' : ''} onchange="toggleNetworkInputs()"> 动态IP (DHCP)</label>`;
                html += `<label><input type="radio" name="ip_mode" value="static" ${!isDhcp ? 'checked' : ''} onchange="toggleNetworkInputs()"> 静态IP</label>`;
                html += `</div></div>`;

                // 2. 渲染输入框
                fields.forEach(field => {
                    const value = data[field.key] || '';
                    const fieldId = `field_${field.key}`;
                    // 如果是动态IP，输入框设为禁用
                    const disabled = isDhcp ? 'disabled' : '';
                    
                    html += `<div style="display: flex; align-items: center; justify-content: space-between;">`;
                    html += `<label for="${fieldId}" style="width: 80px; color: #555;">${field.label}：</label>`;
                    html += `<input type="text" id="${fieldId}" value="${value}" ${disabled} 
                               style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; background-color: ${isDhcp ? '#f5f5f5' : '#fff'};">`;
                    html += `</div>`;
                });

                // 3. 保存按钮
                html += `<div style="text-align: right; margin-top: 10px;">
                            <button type="button" onclick="saveNetworkData()" 
                                    style="padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                保存设置
                            </button>
                         </div>`;
                html += `</form>`;

                targetContent.innerHTML = html;
            })
            .catch(error => {
                console.error('获取网络设置失败:', error);
                targetContent.innerHTML = '<span style="color:red;">❌ 加载失败</span>';
            });
    }
}

// 切换输入框的禁用状态（供单选框 onchange 调用）
function toggleNetworkInputs() {
    const mode = document.querySelector('input[name="ip_mode"]:checked').value;
    const inputs = document.querySelectorAll('#field_local_ip, #field_subnet_mask, #field_gateway_ip, #field_dns_ip');
    
    inputs.forEach(input => {
        if (mode === 'dhcp') {
            input.disabled = true;
            input.style.backgroundColor = '#f5f5f5';
        } else {
            input.disabled = false;
            input.style.backgroundColor = '#fff';
        }
    });
}

// 保存网络设置
function saveNetworkData() {
    const mode = document.querySelector('input[name="ip_mode"]:checked').value;
    
    // 收集数据
    const formData = {
        // 如果是动态IP，提交空字符串；如果是静态IP，获取输入框的值
        local_ip: mode === 'dhcp' ? '' : document.getElementById('field_local_ip').value,
        subnet_mask: mode === 'dhcp' ? '' : document.getElementById('field_subnet_mask').value,
        gateway_ip: mode === 'dhcp' ? '' : document.getElementById('field_gateway_ip').value,
        dns_ip: mode === 'dhcp' ? '' : document.getElementById('field_dns_ip').value
    };

    // 转换为表单格式
    const urlEncodedData = Object.keys(formData)
        .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(formData[key]))
        .join('&');

    fetch('http://172.168.16.128/network', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: urlEncodedData
    })
    .then(response => {
        if (!response.ok) throw new Error('网络请求失败');
        return response.json();
    })
    .then(data => {
        if (data.code === 0) {
            alert(data.msg || '✅ 网络设置保存成功！');
            loadNetworkData(); // 刷新界面
        } else {
            alert('❌ ' + (data.msg || '未知错误'));
        }
    })
    .catch(error => {
        console.error('提交数据时出错:', error);
        alert('❌ 提交失败，请检查网络连接。');
    });
}
function loadServiceData() {
    // 加载服务设置数据
}
</script>
</html>
